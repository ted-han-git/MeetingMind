name: MeetingCrew
options:
  bundleIdPrefix: com.meetingcrew
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  MeetingCrew:
    type: application
    platform: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: MeetingCrew
        excludes:
          - "Resources/Info.plist"
    resources:
      - path: MeetingCrew/Resources/Assets.xcassets
    info:
      path: MeetingCrew/Resources/Info.plist
      properties:
        CFBundleDisplayName: MeetingCrew
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: "1"
        NSMicrophoneUsageDescription: 회의 음성을 실시간으로 텍스트로 변환하기 위해 마이크를 사용합니다.
        NSSpeechRecognitionUsageDescription: 회의 내용을 한국어 텍스트로 변환하기 위해 Apple 음성 인식을 사용합니다.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
    entitlements:
      path: MeetingCrew/Resources/MeetingCrew.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meetingcrew.app
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
